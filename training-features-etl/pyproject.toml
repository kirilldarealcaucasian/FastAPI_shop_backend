[project]
name = "training-features-etl"
version = "0.1.0"
description = "Daily ETL for user interaction training features"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.29.0",
    "aiobotocore>=2.13.1,<3.0.0",
    "pyarrow>=19.0.1,<20.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "loguru>=0.7.3,<0.8.0",
    "shared-lib",
]

[tool.uv.sources]
shared-lib = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["training_features_etl"]
