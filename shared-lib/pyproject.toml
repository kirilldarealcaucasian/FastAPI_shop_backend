[project]
name = "shared-lib"
version = "0.1.0"
description = "Shared infrastructure utilities for workspace services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.111.0,<0.112.0",
    "redis>=5.0.0,<6.0.0",
    "aiokafka>=0.11.0,<1.0.0",
    "aiobotocore>=2.13.1,<3.0.0",
    "botocore>=1.34.131,<2.0.0",
    "asyncpg==0.29.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared_lib", "shared_lib.recommendations"]
