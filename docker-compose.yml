services:
  postgres:
    image: postgres:15
    container_name: postgres_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proj_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proj_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: redpandadata/redpanda:v24.1.7
    container_name: kafka_container
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-01-31T20-34-41Z
    container_name: minio_container
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  marketplace-backend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/marketplace-backend.txt
        SERVICE_SRC_DIR: marketplace-backend
        SERVICE_DST_DIR: marketplace-backend
        PYTHONPATH_VALUE: /app/marketplace-backend:/app/shared-lib
        APP_WORKDIR: /app/marketplace-backend
        APP_PORT: "8000"
        APP_CMD: uvicorn application.cmd:app --host 0.0.0.0 --port 8000
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/marketplace-backend:local
    container_name: marketplace_backend
    restart: unless-stopped
    environment:
      MODE: DEV
      LOG_LEVEL: INFO
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: public
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: proj_db
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_SERVER: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: proj_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SHOPPING_SESSION_DURATION: "1:0:0"
      SHOPPING_SESSION_COOKIE_NAME: shopping_session_id
      YOOCASSA_SECRET_KEY: test_key
      EVENTS_COLLECTOR_BASE_URL: http://events-collector:8010
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_EVENTS_BUCKET: events
      MINIO_REGION: us-east-1
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      events-collector:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/auth.txt
        SERVICE_SRC_DIR: auth
        SERVICE_DST_DIR: auth
        PYTHONPATH_VALUE: /app:/app/shared-lib
        APP_WORKDIR: /app
        APP_PORT: "8001"
        APP_CMD: uvicorn auth.cmd:app --host 0.0.0.0 --port 8001
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/auth:local
    container_name: auth_application
    restart: unless-stopped
    environment:
      MODE: DEV
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: proj_db
      DB_SCHEMA: auth
      SALT: test_salt
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  events-collector:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/events-collector.txt
        SERVICE_SRC_DIR: events-collector
        SERVICE_DST_DIR: events_collector
        PYTHONPATH_VALUE: /app:/app/shared-lib
        APP_WORKDIR: /app
        APP_PORT: "8010"
        APP_CMD: uvicorn events_collector.cmd:app --host 0.0.0.0 --port 8010
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/events-collector:local
    container_name: events_collector
    restart: unless-stopped
    environment:
      MODE: DEV
      LOG_LEVEL: INFO
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      KAFKA_EVENTS_TOPIC: book_events
      JWT_PUBLIC_KEY_PATH: /app/auth/certs/jwt_public_key.pem
      JWT_DECODE_ALGORITHM: RS256
    ports:
      - "8010:8010"
    depends_on:
      kafka:
        condition: service_healthy

  events-saver:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/events-saver.txt
        SERVICE_SRC_DIR: events-saver
        SERVICE_DST_DIR: events-saver
        PYTHONPATH_VALUE: /app/events-saver:/app/shared-lib
        APP_WORKDIR: /app
        APP_CMD: python -m event_saver.main
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/events-saver:local
    container_name: event_saver_worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: book_events
      KAFKA_GROUP_ID: event-saver
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: proj_db
      DB_SCHEMA: events
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  training-features-etl:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/training-features-etl.txt
        SERVICE_SRC_DIR: training-features-etl
        SERVICE_DST_DIR: training-features-etl
        PYTHONPATH_VALUE: /app/training-features-etl:/app/shared-lib
        APP_WORKDIR: /app
        APP_CMD: python -m training_features_etl.main
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/training-features-etl:local
    container_name: training_features_etl
    restart: unless-stopped
    environment:
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: proj_db
      DB_SCHEMA: events
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: events
      S3_REGION: us-east-1
      S3_SECURE: "false"
      ETL_RUN_ON_STARTUP: "true"
      ETL_LOOKBACK_DAYS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  recommendations:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python-service
      args:
        REQUIREMENTS_FILE: dockerfiles/requirements/recommendations.txt
        SERVICE_SRC_DIR: recommendations
        SERVICE_DST_DIR: recommendations
        PYTHONPATH_VALUE: /app
        APP_WORKDIR: /app
        APP_PORT: "8020"
        APP_CMD: uvicorn recommendations.main:app --host 0.0.0.0 --port 8020
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/recommendations:local
    container_name: recommendations_service
    restart: unless-stopped
    ports:
      - "8020:8020"

  marketplace-frontend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.marketplace-frontend
      x-bake:
        platforms:
          - linux/amd64
    image: fastapi-shop/marketplace-frontend:local
    container_name: marketplace_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "4173:4173"
    depends_on:
      marketplace-backend:
        condition: service_started

  celery-worker:
    image: fastapi-shop/marketplace-backend:local
    container_name: celery_worker
    restart: unless-stopped
    working_dir: /app/marketplace-backend
    environment:
      MODE: DEV
      LOG_LEVEL: INFO
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: public
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: proj_db
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_SERVER: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: proj_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SHOPPING_SESSION_DURATION: "1:0:0"
      SHOPPING_SESSION_COOKIE_NAME: shopping_session_id
      YOOCASSA_SECRET_KEY: test_key
      EVENTS_COLLECTOR_BASE_URL: http://events-collector:8010
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_EVENTS_BUCKET: events
      MINIO_REGION: us-east-1
      MINIO_SECURE: "false"
      PYTHONPATH: /app/marketplace-backend:/app/shared-lib
    command: ["celery", "-A", "infrastructure.celery.app:celery", "worker", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
      marketplace-backend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
