version: '3.9'

services:
  web:
    container_name:
      shop_application

    build: ..

    command: bash -c "uvicorn application.cmd:app --reload --host 0.0.0.0 --port 8000"

    env_file:
      - ../core/config/.env

    volumes:
      - shared_volume:/project/application/static/images
      - ../application/static/images:/project/application/static/images

    ports:
      - "8000:8000"

    depends_on:
      - db
      - celery
      - minio

  auth:
    container_name:
      auth_application

    build: ..

    command: bash -c "uvicorn auth.cmd:app --reload --host 0.0.0.0 --port 8001"

    env_file:
      - ../auth/.env

    ports:
      - "8001:8001"

    depends_on:
      - db

  db:
    container_name:
      postgres_database

    image: postgres:15

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5433
      - POSTGRES_DB=proj_db

    ports:
      - "5432:5432"

  migrator:
    build:
       context: ..

    deploy:
       restart_policy:
         condition: on-failure
         max_attempts: 7

    command: bash -c "alembic revision --autogenerate && alembic upgrade head"

    depends_on:
       - db


  redis:
   container_name:
     redis_container

   image: redis:7

   ports:
     - "6379:6379"

  celery:
   container_name:
     celery_container

   build:
    context:
      ..

   environment:
     - REDIS_HOST=redis
     - REDIS_PORT=6379

   volumes:
     - shared_volume:/project/application/static/images

   depends_on:
     - redis

   command: bash -c "celery -A infrastructure.celery.app:celery worker --loglevel=INFO"

  minio:
   container_name:
     minio_container

   image: minio/minio:RELEASE.2026-01-31T20-34-41Z

   environment:
     - MINIO_ROOT_USER=minioadmin
     - MINIO_ROOT_PASSWORD=minioadmin

   command: server /data --console-address ":9001"

   ports:
     - "9000:9000"
     - "9001:9001"

  kafka:
   container_name:
     kafka_container

   image: redpandadata/redpanda:v24.1.7

   command:
     - redpanda
     - start
     - --overprovisioned
     - --smp
     - "1"
     - --memory
     - 512M
     - --reserve-memory
     - 0M
     - --node-id
     - "0"
     - --check=false
     - --kafka-addr
     - PLAINTEXT://0.0.0.0:9092
     - --advertise-kafka-addr
     - PLAINTEXT://kafka:9092

   ports:
     - "9092:9092"

  event_saver:
   container_name:
     event_saver_worker

   build:
    context: .
    dockerfile: dockerfiles/Dockerfile.event-saver

   environment:
     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
     - KAFKA_TOPIC=book_events
     - KAFKA_GROUP_ID=event-saver
     - DB_SERVER=db
     - DB_PORT=5432
     - DB_USER=postgres
     - DB_PASSWORD=postgres
     - DB_NAME=proj_db
     - DB_SCHEMA=public

   depends_on:
     - kafka
     - db



volumes:
  shared_volume:
