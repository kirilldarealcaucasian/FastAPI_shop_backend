worker_processes auto;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Allow and preserve non-standard headers like X_User-Role if auth sends them.
    underscores_in_headers on;
    ignore_invalid_headers off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream auth_service {
        server auth:8001;
    }

    upstream marketplace_backend_service {
        server marketplace-backend:8000;
    }

    upstream events_collector_service {
        server events-collector:8010;
    }

    upstream recommendations_service {
        server recommendations:8020;
    }

    upstream marketplace_frontend_service {
        server marketplace-frontend:4173;
    }

    server {
        listen 80;
        server_name _;

        location = /health/nginx {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Internal auth check before forwarding requests to marketplace-backend.
        # IMPORTANT: adjust /api/v1/auth/validate to your real auth-check endpoint.
        location = /_auth_marketplace_check {
            internal;
            proxy_pass http://auth_service/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            # Keep original auth data for validation.
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # Auth service endpoints are public (no auth_request).
        location ^~ /api/v1/auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Direct auth service path without /api prefix (also public).
        location ^~ /v1/auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Events collector is publicly available (no auth).
        location ^~ /api/v1/events/ {
            proxy_pass http://events_collector_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Events collector public path with explicit service prefix.
        location ^~ /events-collector/ {
            rewrite ^/events-collector/?(.*)$ /$1 break;
            proxy_pass http://events_collector_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Recommendations service is public (no auth).
        location ^~ /api/v1/recommendations/ {
            proxy_pass http://recommendations_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Recommendations public path with explicit service prefix.
        location ^~ /recommendations/ {
            rewrite ^/recommendations/?(.*)$ /$1 break;
            proxy_pass http://recommendations_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Marketplace API is protected by auth service.
        location ^~ /api/v1/ {
            auth_request /_auth_marketplace_check;

            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://marketplace_backend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Propagate identity from auth and keep the original cookie.
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header X_User-Role $auth_user_role;
            proxy_set_header Cookie $http_cookie;
        }

        # Frontend fallback.
        location / {
            proxy_pass http://marketplace_frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
